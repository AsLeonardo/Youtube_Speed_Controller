<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #1f1f1f;
    --fg: #f1f1f1;
    --muted: #9a9a9a;
    --accent: #ff0033;
    --track: #444;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 260px;
  }
  .wrap {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .label {
    font-size: 13px;
  }

                                    /*toggle*/
  .switch {
    position: relative;
    width: 38px;
    height: 22px;
  }
  .switch input { display: none; }
  .slider-toggle {
    position: absolute;
    inset: 0;
    background: var(--track);
    border-radius: 22px;
    transition: background 0.18s;
    cursor: pointer;
  }
  .slider-toggle::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.18s;
  }
  .switch input:checked + .slider-toggle {
    background: var(--accent);
  }
  .switch input:checked + .slider-toggle::before {
    transform: translateX(16px);
  }

                                    /*speed display*/
  .speed-display {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .speed-display .x {
    color: var(--muted);
    font-weight: 500;
    font-size: 18px;
    margin-left: 2px;
  }

                                    /*slider blocks*/
  .slider-block {
    transition: opacity 0.18s;
  }
  .slider-block.inactive {
    opacity: 0.4;
  }
  .slider-block .range-header {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  .slider-block .range-header .badge {
    color: var(--accent);
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.18s;
  }
  .slider-block:not(.inactive) .range-header .badge {
    opacity: 1;
  }

                                    /*range*/
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    margin: 0;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    background: var(--track);
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 16px;
    width: 16px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -6px;
    cursor: pointer;
  }
  .slider-block.inactive input[type=range]::-webkit-slider-thumb {
    background: var(--muted);
  }

  .range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  .disabled { opacity: 0.45; pointer-events: none; }

  .divider {
    height: 1px;
    background: var(--track);
    margin: 2px 0;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">YouTube Speed</div>

    <div class="row">
      <span class="label">Enabled</span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div id="controls">
      <div class="speed-display">
        <span id="speedValue">2.00</span><span class="x">x</span>
      </div>

      <div class="slider-block" id="lowBlock" data-range="low">
        <div class="range-header">
          <span>Normal</span><span class="badge">●</span>
        </div>
        <input type="range" id="lowSpeed" min="0.1" max="2.0" step="0.05" value="2.0" />
        <div class="range-labels">
          <span>0.1x</span><span>1.0x</span><span>2.0x</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="slider-block inactive" id="highBlock" data-range="high">
        <div class="range-header">
          <span>Turbo</span><span class="badge">●</span>
        </div>
        <input type="range" id="highSpeed" min="2.0" max="4.0" step="0.05" value="2.0" />
        <div class="range-labels">
          <span>2.0x</span><span>3.0x</span><span>4.0x</span>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
